name: release

# Tag pushes (v*) build and publish a GitHub Release. Manual dispatch runs the
# same build and tests but publishes nothing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Lint workflows
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.7

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag ${GITHUB_REF_NAME} must be v<major>.<minor>.<patch>" >&2
              exit 1
            fi
            publish=true
          else
            version="$(date -u +%Y.%-m.%-d)"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  package:
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: python -m pip install --disable-pip-version-check lxml mako pyyaml

      - name: Install Inno Setup
        shell: pwsh
        run: scripts/ci/install-innosetup.ps1

      - name: Install native build tools (NASM, WinFlexBison, gperf)
        shell: pwsh
        run: scripts/ci/install-build-tools.ps1

      - name: Build server and portable runtime
        shell: pwsh
        run: |
          # Keep Git Bash's usr/bin, bin and mingw tools off PATH so they
          # cannot shadow MSVC (link.exe) or inject MSYS/Cygwin binaries.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Git\\usr|Git\\bin|Git\\mingw' }) -join ';'
          scripts/build/buildall.ps1 -Stage All -Configuration Release -Architecture x64 -Jobs 4 `
              -EnvironmentReport .local-validation/ci-environment.json

      - name: Run test suite
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $vcEnvironment = & $env:ComSpec /d /c "call `"$vcvars`" amd64 >nul && set"
          foreach ($line in $vcEnvironment) {
              if ($line -match '^([^=]+)=(.*)$') {
                  [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
              }
          }
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Git\\usr|Git\\bin|Git\\mingw' }) -join ';'
          $env:VCXSRV_TEST_LOCAL_TOOLS = '1'
          $env:MHMAKECONF = (Resolve-Path '.').Path
          $env:IS64 = '1'
          $env:PYTHONUTF8 = '1'
          python -B -m unittest discover -s tools/tests -v

      - name: Package full and slim editions
        shell: pwsh
        run: |
          $version = '${{ needs.preflight.outputs.version }}'
          $dist = 'dist/x64/Release'
          python -B tools/package_release.py --dist-dir $dist --version $version
          python -B tools/package_release.py --dist-dir $dist --version $version --edition slim

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist/release -File | Sort-Object Name | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [System.IO.File]::WriteAllLines("$PWD/dist/release/SHA256SUMS.txt", $lines)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zzxsrv-${{ needs.preflight.outputs.version }}-x64
          path: dist/release/*
          retention-days: 7

  release:
    needs: [preflight, package]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: zzxsrv-${{ needs.preflight.outputs.version }}-x64
          path: dist/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "ZzXsrv ${{ needs.preflight.outputs.version }}" \
            --generate-notes \
            dist/release/*
