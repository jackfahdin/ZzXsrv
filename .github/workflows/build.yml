name: build

on:
  push:
    branches: [master]
    tags: ['zz-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: git 行尾（必须在 checkout 前）
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          path: vcxsrv

      - name: 安装 Windows 侧构建依赖
        shell: powershell
        run: |
          choco install -y strawberryperl
          choco install -y jom nasm nsis gperf
          choco install -y python3 --version 3.9.13
          # mesalib 的 u_format_table.py 还需要 yaml（pyyaml）
          C:\Python39\python.exe -m pip install lxml mako pyyaml

      - name: 复刻 setenv 硬编码路径
        shell: powershell
        run: |
          # setenv.sh 期望 /mnt/c/perl、/mnt/c/nasm、/mnt/c/winflexbison、/mnt/c/Python39
          New-Item -ItemType Junction -Path C:\perl -Target C:\Strawberry
          New-Item -ItemType Directory -Path C:\nasm -Force
          Copy-Item "C:\Program Files\NASM\nasm.exe" C:\nasm\
          # tools/mhmake 自带 bison 3.8.2 骨架（BISON_PKGDATADIR=src/bisondata），
          # 必须用 win_bison 3.8.2 即 winflexbison 2.5.25；choco winflexbison3 是
          # 2.5.24（bison 3.7.4），muscle 接口不匹配会报 invalid header value
          New-Item -ItemType Directory -Path C:\winflexbison -Force
          curl.exe -fsSL https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip -o C:\winflexbison\winflexbison.zip
          # 官方 zip 是唯一未钉哈希的外部输入：下载后 SHA256 对比硬编码值，
          # 不等即 throw。哈希为 2026-08-24 从官方 release 实算（字符串必须
          # 纯 ASCII，中文只放注释，防 PS5.1 无 BOM cp1252 解码炸解析）
          $expected = '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135'
          $actual = (Get-FileHash C:\winflexbison\winflexbison.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "winflexbison.zip SHA256 mismatch: expected $expected, got $actual" }
          Expand-Archive C:\winflexbison\winflexbison.zip -DestinationPath C:\winflexbison
          Remove-Item C:\winflexbison\winflexbison.zip

      - name: 安装 Cygwin 工具包
        shell: powershell
        run: |
          choco install -y cygwin
          # cygwinsetup.exe 是 GUI 子系统程序，PowerShell 直接调用不会等待它退出，
          # 必须用 Start-Process -Wait；否则步骤「假绿」继续往下走，
          # 包根本没装完，后面怎么注入 PATH 都找不到
          # -x gperf：排除 cygwin 版 gperf——它处理不了 mhmake 以 Windows 路径
          # 生成的 fcobjshash.gperf（junk after declaration），gperf 改用 choco
          # 的 Windows 原生包（上游 commit 39b02b2 的同款方案）
          $setup = Start-Process -Wait -PassThru -FilePath C:\tools\cygwin\cygwinsetup.exe `
            -ArgumentList '-q','-n','-R','C:\tools\cygwin','-P','bison,flex,gawk,gzip,nasm,sed,python38-lxml','-x','gperf'
          Write-Host "cygwinsetup exit code: $($setup.ExitCode)"
          if (-not (Test-Path C:\tools\cygwin\bin\flex.exe)) {
            Get-Content C:\tools\cygwin\var\log\setup.log -Tail 40 -ErrorAction SilentlyContinue
            throw "cygwin 包未装上（cygwinsetup 未完成安装）"
          }
          # cygwin link.exe 与 MSVC link.exe 冲突，改名
          Rename-Item C:\tools\cygwin\bin\link.exe link-cygwin.exe
          [Environment]::SetEnvironmentVariable('CYGWIN', 'winsymlinks:lnk', 'Machine')
          $env:CYGWIN = 'winsymlinks:lnk'

      - name: 安装 WSL（Ubuntu）
        uses: Vampire/setup-wsl@v7
        with:
          # 必须 24.04：xkeyboard-config 2.44 的 meson 要求 python3 带 strenum
          # 模块（即 python >= 3.11 的 StrEnum）；22.04 只有 python 3.10，
          # meson setup 报 python3 is missing modules: strenum
          # （run 32660002174 attempt 1）。24.04 自带 python 3.12
          distribution: Ubuntu-24.04
          wsl-version: 1
          # meson/ninja：xorg-server/xkeyboard-config 的 build.sh 经 wsl 调 meson
          # （run 32657983662 attempt 1 报 meson: command not found）
          additional-packages: python-is-python3 patch meson ninja-build

      - name: 构建 ZzXsrv（WSL + mhmake 原链）
        shell: powershell
        run: |
          # mhmake 经 cmd 调用 cygwin 工具（flex/bison/sed 等），cygwin bin 需在 PATH。
          # 试过 Machine PATH（对运行中的 runner agent 无效）和 $GITHUB_PATH
          # （未生效），最直接可靠的是本步骤进程内注入，wsl 子进程自然继承。
          # gperf 是 choco 原生包（chocolatey\bin 本就在 PATH），此处一并校验
          $env:Path = "C:\tools\cygwin\bin;$env:Path"
          if (-not (Get-Command gperf.exe -ErrorAction SilentlyContinue)) { throw "gperf.exe 不在 PATH" }
          $p = (Get-Location).Path -replace '\\','/'
          $ws = '/mnt/' + $p.Substring(0,1).ToLower() + $p.Substring(2)
          # openssl 阶段 jom 并行偶发 Error 2（cl 输出被重定向进 .d 无法直接
          # 看到，历史上约一半 run 命中，且失败 target 不固定）。Defender
          # 排除实测无效（run 32657983662 两次 attempt 均挂），现假设为
          # mspdbsrv（-FS 共享 PDB 协调服务）在 WSL1 interop 进程树下状态
          # 腐烂——job 结束时它成了孤儿进程。每次 attempt 前宰掉它重启；
          # 重试加到 4 次兜底（jom/nmake/mhmake 增量，开销可接受）
          Add-MpPreference -ExclusionPath 'D:\a' -ErrorAction SilentlyContinue
          # buildall.sh 的 check-error 会吞失败（裸 exit 继承上条 echo 的 0），
          # wsl 退出码不可信：Tee 落盘后扫描失败标记，防止 mesalib/installer
          # 等尾部阶段挂了还假绿（run 32654629928 的教训）。
          # 注意：字符串字面量一律纯 ASCII——无 BOM 临时 ps1 被 PS5.1 按
          # cp1252 解码，中文 UTF-8 尾字节 0x82/0x84/0x91-0x94 会被解成
          # 智能引号炸解析；中文只放注释（多字节序列结构上不含 0x0A/0x60
          # 等结构字节，注释必安全）
          $ok = $false
          foreach ($i in 1..4) {
            Write-Host "=== buildall attempt $i of 4 ==="
            Stop-Process -Name mspdbsrv -Force -ErrorAction SilentlyContinue
            wsl -d Ubuntu-24.04 bash -lc "cd '$ws/vcxsrv' && ./buildall.sh 1 5 R" | Tee-Object -FilePath "build-$i.log"
            $code = $LASTEXITCODE
            $hit = Select-String -Path "build-$i.log" -Pattern 'Error compiling','Error running command' -CaseSensitive -Quiet
            if ($code -eq 0 -and -not $hit) { $ok = $true; break }
            Write-Host "attempt $i failed (exit=$code, marker=$hit), retrying"
          }
          if (-not $ok) {
            # 失败取证：cl /Zs 依赖生成命令的输出在 .d 里，扫含 error 的 .d
            Get-ChildItem vcxsrv\openssl\release64 -Recurse -Filter *.d -ErrorAction SilentlyContinue |
              Select-String -Pattern 'error' -List -ErrorAction SilentlyContinue |
              ForEach-Object { "=== $($_.Path)"; Get-Content $_.Path -TotalCount 80 -ErrorAction SilentlyContinue }
            throw "buildall failed after 4 attempts"
          }

      - name: 失败取证（openssl buildtest 失败输出被重定向进 .d）
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem vcxsrv\openssl\release64\test -Filter 'buildtest_c_types*' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.FullName)"; Get-Content $_.FullName -TotalCount 60 -ErrorAction SilentlyContinue }

      - name: 核验基线产物
        shell: powershell
        run: |
          $exe = "vcxsrv\xorg-server\obj64\servrelease\ZzXsrv.exe"
          if (-not (Test-Path $exe)) { throw "ZzXsrv.exe 未产出" }
          (Get-Item $exe).Length
          # 品牌化反向断言：旧名产物不得再出现（throw 文案必须纯 ASCII，
          # 防 PS5.1 无 BOM cp1252 解码炸解析，中文只放注释）
          if (Test-Path "vcxsrv\xorg-server\obj64\servrelease\vcxsrv.exe") { throw "vcxsrv.exe still exists: rebrand incomplete" }
          # installer 阶段（packageall.sh）失败无任何标记，只能靠产物核验兜底
          $inst = Get-ChildItem "vcxsrv\xorg-server\installer\zzxsrv-64.*.installer.exe" -ErrorAction SilentlyContinue
          if (-not $inst) { throw "installer exe missing" }
          $inst | ForEach-Object { "$($_.Name) $($_.Length)" }
          # xkeyboard-config 假绿兜底：meson 失败时 mhmake 的 mkdir 已建 xkbdata
          # 目录，重试会因目录存在跳过 wsl ./build.sh，导致 xkbdata 为空但
          # ZzXsrv.exe/installer 照常产出（run 32660002174 实际发生：
          # symbols.dir 等全部 The system cannot find the path specified）。
          # symbols 正常应有数百个文件、symbols.dir 数百 KB
          $sym = "vcxsrv\xorg-server\xkbdata\symbols"
          $cnt = (Get-ChildItem $sym -File -ErrorAction SilentlyContinue).Count
          if ($cnt -lt 100) { throw "xkbdata symbols files missing or too few: $cnt" }
          $sd = Get-Item "vcxsrv\xorg-server\xkbdata\symbols.dir" -ErrorAction SilentlyContinue
          if (-not $sd -or $sd.Length -lt 10000) { throw "xkbdata symbols.dir missing or too small" }
          # M4b 裁剪回退防线：xlaunch/apps/plink/mesa 软渲染产物已移出构建图
          # （EXTRASTOBUILD 只留 xkbcomp），obj64 下再现即 throw
          $cut = @('swrast_dri.dll','swrastwgl_dri.dll','dxtn.dll','xlaunch.exe','plink.exe','xcalc.exe','xclock.exe','xwininfo.exe','xhost.exe','xrdb.exe','xauth.exe','libXext.dll','libXmu.dll')
          foreach ($f in $cut) {
            $hit = Get-ChildItem vcxsrv -Recurse -Filter $f -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'obj64' }
            if ($hit) { throw "cut artifact still built: $($hit.FullName)" }
          }

      # NSIS 打包无需单独步骤：buildall.sh 已调 packageall.sh nox86，
      # admin + noadmin 双份 installer 随构建产出（任务1 run 32662240347
      # 实证），tag 构建只需补算 SHA256
      - name: 计算 SHA256（tag 构建）
        if: startsWith(github.ref, 'refs/tags/zz-')
        shell: powershell
        run: |
          Get-ChildItem vcxsrv\xorg-server\installer\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: vcxsrv-baseline
          path: |
            vcxsrv/xorg-server/obj64/servrelease/ZzXsrv.exe
            vcxsrv/xorg-server/installer/*.exe*
          if-no-files-found: warn

      # 冒烟断言放在 artifact 上传之后：反例轮（未 patch 基线）本步骤必红，
      # 但基线产物已落 artifact 不受影响。
      # 必须 pwsh：throw 字符串含中文，PS5.1 会把无 BOM 临时 ps1 按 cp1252
      # 解码，「应」「监」等字尾字节 0x94/0x91 被解成智能引号炸解析
      # （run 32655684994/32656197320 的教训）；pwsh 7 按 UTF-8 读取则安全
      # 必须显式 -listen tcp：本仓库 mhmake 构建未定义 LISTEN_TCP，
      # os/utils.c 的 defaultNoListenList 使 tcp 默认 nolisten
      # （run 32664115895 未加该参数时 6099 无任何监听）
      # 运行时布局：RELOCATE_PROJECTROOT 未定义（xwin-config.h），
      # include/dix-config.h 全是 CWD 相对路径——PROJECTROOT "."、
      # XKB_BASE_DIRECTORY "xkbdata"、XKB_BIN_DIRECTORY "."、
      # COMPILEDDEFAULTFONTPATH "./fonts/..."。这里把运行时资源铺进
      # exe 目录并以其为 CWD。真根因（run 32672126036 定位）：
      # ZzXsrv.exe 动态链接 freetype/libX11/libXau/libxcb/libcrypto/
      # zlib1 等 DLL，servrelease 裸目录缺 DLL → 加载器 0xC0000135
      # 退出（交互会话下表现为错误对话框阻塞、进程「假存活」）
      - name: 冒烟：监听地址断言
        shell: pwsh
        run: |
          $serv = "$PWD\vcxsrv\xorg-server\obj64\servrelease"
          Copy-Item "$PWD\vcxsrv\xorg-server\xkbdata" "$serv\xkbdata" -Recurse -Force
          Copy-Item "$PWD\vcxsrv\xorg-server\fonts" "$serv\fonts" -Recurse -Force
          Copy-Item "$PWD\vcxsrv\xkbcomp\obj64\release\xkbcomp.exe" $serv -Force
          Copy-Item "$PWD\vcxsrv\xorg-server\XKeysymDB" $serv -Force
          # 依赖 DLL（真根因，run 32672126036：退出码 -1073741515 =
          # 0xC0000135 STATUS_DLL_NOT_FOUND——servrelease 里只有裸
          # ZzXsrv.exe，此前「进程存活」轮是加载器错误对话框阻塞变体）。
          # 清单按 installer/mkzip-64.sh 的打包来源，依赖闭已经 artifact
          # 的 NSIS 安装包解出逐个 objdump 验证：
          # ZzXsrv.exe→freetype/libX11/libXau/libxcb/libcrypto/zlib1，
          # libX11→libxcb→libXau
          # M4b 裁剪后 GL 三件套（swrast_dri/swrastwgl_dri/dxtn）已移出
          # 构建图不再产出，此处不再拷贝（exe 运行时动态加载失败只影响
          # GL 扩展，冒烟断言的监听行为不涉及 GL）
          Copy-Item "$PWD\vcxsrv\zlib\obj64\release\zlib1.dll" $serv -Force
          Copy-Item "$PWD\vcxsrv\libxcb\src\obj64\release\libxcb.dll" $serv -Force
          Copy-Item "$PWD\vcxsrv\libXau\obj64\release\libXau.dll" $serv -Force
          Copy-Item "$PWD\vcxsrv\libX11\obj64\release\libX11.dll" $serv -Force
          Copy-Item "$PWD\vcxsrv\openssl\release64\libcrypto-3-x64.dll" $serv -Force
          Copy-Item "$PWD\vcxsrv\freetype\objs\x64\Release\freetype.dll" $serv -Force
          $exe = "$serv\ZzXsrv.exe"
          # 日志真实落点：RELOCATE_PROJECTROOT 未定义时
          # g_pszLogFile = DEFAULT_LOGDIR "/XWin.%s.log"（winglobals.c:67），
          # %s=display 号，DEFAULT_LOGDIR "."（xwin-config.h:33），
          # 且 main() 启动即 chdir 到 exe 目录（dix/main.c:170-183）
          # → 日志固定为 exe 目录下的 XWin.99.log（不是 XWin.log！
          # run 32668735441 按 XWin.log 取证扑空的原因）
          # run 32670557589 结果：进程存活且无窗口、无 socket、且
          # XWin.99.log 也不存在 → 连 LogInit 都没走到，卡点在
          # OsVendorPreInit 之前（或 fopen 失败走 fatal→MessageBox）。
          # 本轮升级取证：stderr/stdout 重定向（LogInit 前 ErrorF 走
          # stderr）、线程等待原因（UserRequest=GUI 模态框）、
          # EnumWindows 列窗口（捕捉加载器缺 DLL 对话框）、
          # TcpListener 试绑 6099 + netsh 排除端口段（端口保留假设）
          $out = "$serv\smoke-stdout.txt"; $err = "$serv\smoke-stderr.txt"
          $p = Start-Process -FilePath $exe -ArgumentList ':99','-multiwindow','-ac','-listen','tcp','-logverbose','3' -WorkingDirectory $serv -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 15
          $listen = netstat -ano | Select-String ':6099\s+.*LISTENING'
          $listen | ForEach-Object { $_.Line }
          # 取证1：进程身份与线程等待原因
          Get-CimInstance Win32_Process -Filter "ProcessId=$($p.Id)" -ErrorAction SilentlyContinue |
            Select-Object ProcessId,ExecutablePath,CommandLine | Format-List
          Get-Process -Id $p.Id -ErrorAction SilentlyContinue | ForEach-Object {
            $_.Threads | ForEach-Object {
              $wr = ''
              if ($_.ThreadState -eq [System.Diagnostics.ThreadState]::Wait) {
                try { $wr = "$($_.WaitReason)" } catch { $wr = '?' }
              }
              [pscustomobject]@{ State = "$($_.ThreadState)"; WaitReason = $wr }
            } | Group-Object State,WaitReason | Select-Object Count,Name
          }
          # 取证2：该进程全部窗口标题（模态 MessageBox / 加载器缺 DLL 框在此现形）
          $wsrc = @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class WinEnum {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            public static string Dump(uint target) {
              var sb2 = new StringBuilder();
              EnumWindows((h,l) => {
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (pid == target) {
                  var t = new StringBuilder(512);
                  GetWindowTextW(h, t, 512);
                  sb2.AppendLine(string.Format("hwnd={0} visible={1} title=[{2}]", h, IsWindowVisible(h), t));
                }
                return true;
              }, IntPtr.Zero);
              return sb2.ToString();
            }
          }
          '@
          Add-Type -TypeDefinition $wsrc
          "windows of pid $($p.Id):"
          [WinEnum]::Dump([uint32]$p.Id)
          # 取证3：stdout/stderr 重定向内容（LogInit 前的 ErrorF 走 stderr）
          foreach ($f in @($out, $err)) {
            "===== $f ====="
            if (Test-Path $f) { Get-Content $f -Tail 60 } else { "(missing)" }
          }
          # 取证4：pwsh 直接试绑 6099 + 系统排除端口段（端口保留假设）
          try {
            $tl = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Any, 6099)
            $tl.Start(); "pwsh bind 0.0.0.0:6099 OK"; $tl.Stop()
          } catch { "pwsh bind 6099 FAILED: $($_.Exception.Message)" }
          netsh int ipv4 show excludedportrange protocol=tcp
          # 取证5：日志文件（exe 目录 + TEMP 双搜）
          Get-ChildItem "$serv\XWin*.log","$env:TEMP\VCXSrv*.log","$env:TEMP\XWin*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            "===== $($_.FullName) ====="
            Get-Content $_.FullName -Tail 120
          }
          # IPv4/IPv6 对称断言：若未来 IPv6 绑定点回归为 [::]:6099（全网卡），
          # 仅匹配 0.0.0.0 的断言会漏检（审查发现：任务2报告 重要1）
          $hasAny = [bool]($listen | Select-String '0\.0\.0\.0:6099')
          $hasAny6 = [bool]($listen | Select-String '\[::\]:6099')
          $hasLoop = [bool]($listen | Select-String '127\.0\.0\.1:6099')
          $hasLoop6 = [bool]($listen | Select-String '\[::1\]:6099')
          if ($p.HasExited) { throw "ZzXsrv 进程过早退出，代码 $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if ($env:ZZXSRV_LISTEN_ANY -eq '1') {
            if (-not ($hasAny -or $hasAny6)) { throw "旁路模式应监听 0.0.0.0:6099 或 [::]:6099" }
          } else {
            if ($hasAny -or $hasAny6) { throw "默认模式不得监听全网卡（0.0.0.0 或 [::]）" }
            if (-not ($hasLoop -or $hasLoop6)) { throw "默认模式应监听回环（127.0.0.1 或 [::1]）" }
          }

      # 嵌入冒烟（M4b 核心断言）：WinForms 容器窗口 + -parent <HWND> 启动，
      # 断言父窗口下出现 WS_CHILD 子窗口（类名 ZzXsrv/x）+ 进程存活 +
      # 回环 6098 监听。运行时布局（xkbdata/fonts/xkbcomp/XKeysymDB/依赖
      # DLL）由上一步「冒烟：监听地址断言」铺好，直接复用同一 $serv。
      # shell 必须 pwsh（throw 文案含中文，PS5.1 无 BOM cp1252 会炸解析）
      - name: 冒烟：-parent 嵌入断言
        shell: pwsh
        run: |
          $serv = "$PWD\vcxsrv\xorg-server\obj64\servrelease"
          # 运行时布局（与监听冒烟同）：xkbdata/fonts/xkbcomp/XKeysymDB 已在上一步铺好则复用
          Add-Type -AssemblyName System.Windows.Forms
          $form = New-Object System.Windows.Forms.Form
          $form.Width = 800; $form.Height = 600
          $form.Show(); $form.Hide()   # 创建句柄但不展示
          $hwnd = $form.Handle
          $p = Start-Process -FilePath "$serv\ZzXsrv.exe" `
               -ArgumentList ':98','-parent',([string]$hwnd),'-screen','0','800x600','-ac','-listen','tcp' `
               -WorkingDirectory $serv -PassThru
          Start-Sleep -Seconds 10
          # 取证：日志真实落点是 exe 目录下 XWin.<display>.log（见监听冒烟注释），
          # 简报里的 XWin.log 不存在，改用 glob（报告注明偏差）
          if ($p.HasExited) {
            Get-ChildItem "$serv\XWin*.log" -ErrorAction SilentlyContinue | ForEach-Object { "===== $($_.FullName) ====="; Get-Content $_.FullName -Tail 60 }
            throw "ZzXsrv 嵌入模式过早退出，代码 $($p.ExitCode)"
          }
          # 断言父窗口下存在 WS_CHILD 子窗口（类名 ZzXsrv/x）
          $sig = '[DllImport("user32.dll")] public static extern System.IntPtr FindWindowEx(System.IntPtr p, System.IntPtr c, string cls, string title);'
          $u32 = Add-Type -MemberDefinition $sig -Name U32 -Namespace Win32 -PassThru
          $child = $u32::FindWindowEx($hwnd, [System.IntPtr]::Zero, 'ZzXsrv/x', $null)
          if ($child -eq [System.IntPtr]::Zero) {
            Get-ChildItem "$serv\XWin*.log" -ErrorAction SilentlyContinue | ForEach-Object { "===== $($_.FullName) ====="; Get-Content $_.FullName -Tail 60 }
            throw "no child window of class ZzXsrv/x under parent"
          }
          $listen = netstat -ano | Select-String '127\.0\.0\.1:6098\s+.*LISTENING'
          if (-not $listen) { throw "embedded server not listening on 127.0.0.1:6098" }
          Stop-Process -Id $p.Id -Force
          $form.Dispose()

  # tag（zz-*）触发发布。release job 与 build job 文件系统不共享，
  # 安装包走 artifact 传递：upload-artifact 以各 path 的公共祖先
  # （vcxsrv/xorg-server）为根保留相对路径，下载后安装包落在
  # dist/installer/（run 32678143404 实测布局，非完整 workspace 路径）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/zz-')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vcxsrv-baseline
          path: dist

      - name: 收集安装包并核验完整性
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist\installer\*.exe* release\
          Get-ChildItem release | ForEach-Object { "$($_.Name) $($_.Length)" }
          if (-not (Get-ChildItem release\*.installer.noadmin.exe -ErrorAction SilentlyContinue)) { throw "noadmin installer missing in artifact" }
          if (-not (Get-ChildItem release\*.installer.noadmin.exe.sha256 -ErrorAction SilentlyContinue)) { throw "noadmin sha256 missing in artifact" }

      # 必须 pwsh：title/notes 含中文，PS5.1 会把无 BOM 临时 ps1 按
      # cp1252 解码，中文尾字节 0x82/0x84/0x91-0x94 被解成智能引号炸解析
      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag release\* --repo jackfahdin/ZzXsrv `
            --title "ZzXsrv $tag（回环绑定构建）" `
            --notes "基于 vcxsrv 21.1.16.1 + xtrans 回环绑定 patch。默认仅监听 127.0.0.1/::1；ZZXSRV_LISTEN_ANY=1 恢复全网卡（仅限隔离调试）。SHA256 见各 .sha256 文件。"
