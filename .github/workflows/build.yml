name: build

on:
  push:
    branches: [master]
    tags: ['zz-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: git 行尾（必须在 checkout 前）
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          path: vcxsrv

      - name: 安装 Windows 侧构建依赖
        shell: powershell
        run: |
          choco install -y strawberryperl
          choco install -y jom nasm nsis gperf
          choco install -y python3 --version 3.9.13
          # mesalib 的 u_format_table.py 还需要 yaml（pyyaml）
          C:\Python39\python.exe -m pip install lxml mako pyyaml

      - name: 复刻 setenv 硬编码路径
        shell: powershell
        run: |
          # setenv.sh 期望 /mnt/c/perl、/mnt/c/nasm、/mnt/c/winflexbison、/mnt/c/Python39
          New-Item -ItemType Junction -Path C:\perl -Target C:\Strawberry
          New-Item -ItemType Directory -Path C:\nasm -Force
          Copy-Item "C:\Program Files\NASM\nasm.exe" C:\nasm\
          # tools/mhmake 自带 bison 3.8.2 骨架（BISON_PKGDATADIR=src/bisondata），
          # 必须用 win_bison 3.8.2 即 winflexbison 2.5.25；choco winflexbison3 是
          # 2.5.24（bison 3.7.4），muscle 接口不匹配会报 invalid header value
          New-Item -ItemType Directory -Path C:\winflexbison -Force
          curl.exe -fsSL https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip -o C:\winflexbison\winflexbison.zip
          Expand-Archive C:\winflexbison\winflexbison.zip -DestinationPath C:\winflexbison
          Remove-Item C:\winflexbison\winflexbison.zip

      - name: 安装 Cygwin 工具包
        shell: powershell
        run: |
          choco install -y cygwin
          # cygwinsetup.exe 是 GUI 子系统程序，PowerShell 直接调用不会等待它退出，
          # 必须用 Start-Process -Wait；否则步骤「假绿」继续往下走，
          # 包根本没装完，后面怎么注入 PATH 都找不到
          # -x gperf：排除 cygwin 版 gperf——它处理不了 mhmake 以 Windows 路径
          # 生成的 fcobjshash.gperf（junk after declaration），gperf 改用 choco
          # 的 Windows 原生包（上游 commit 39b02b2 的同款方案）
          $setup = Start-Process -Wait -PassThru -FilePath C:\tools\cygwin\cygwinsetup.exe `
            -ArgumentList '-q','-n','-R','C:\tools\cygwin','-P','bison,flex,gawk,gzip,nasm,sed,python38-lxml','-x','gperf'
          Write-Host "cygwinsetup exit code: $($setup.ExitCode)"
          if (-not (Test-Path C:\tools\cygwin\bin\flex.exe)) {
            Get-Content C:\tools\cygwin\var\log\setup.log -Tail 40 -ErrorAction SilentlyContinue
            throw "cygwin 包未装上（cygwinsetup 未完成安装）"
          }
          # cygwin link.exe 与 MSVC link.exe 冲突，改名
          Rename-Item C:\tools\cygwin\bin\link.exe link-cygwin.exe
          [Environment]::SetEnvironmentVariable('CYGWIN', 'winsymlinks:lnk', 'Machine')
          $env:CYGWIN = 'winsymlinks:lnk'

      - name: 安装 WSL（Ubuntu）
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-22.04
          wsl-version: 1
          additional-packages: python-is-python3 patch

      - name: 构建 vcxsrv（WSL + mhmake 原链）
        shell: powershell
        run: |
          # mhmake 经 cmd 调用 cygwin 工具（flex/bison/sed 等），cygwin bin 需在 PATH。
          # 试过 Machine PATH（对运行中的 runner agent 无效）和 $GITHUB_PATH
          # （未生效），最直接可靠的是本步骤进程内注入，wsl 子进程自然继承。
          # gperf 是 choco 原生包（chocolatey\bin 本就在 PATH），此处一并校验
          $env:Path = "C:\tools\cygwin\bin;$env:Path"
          if (-not (Get-Command gperf.exe -ErrorAction SilentlyContinue)) { throw "gperf.exe 不在 PATH" }
          $p = (Get-Location).Path -replace '\\','/'
          $ws = '/mnt/' + $p.Substring(0,1).ToLower() + $p.Substring(2)
          # openssl 阶段 jom 并行偶发 Error 2（cl 输出被重定向进 .d 无法取证，
          # 历史上约一半 run 命中同一 target），疑似 Defender 实时扫描干扰
          # 共享 PDB（-FS/mspdbsrv）：把工作区加入排除列表
          Add-MpPreference -ExclusionPath 'D:\a' -ErrorAction SilentlyContinue
          # buildall.sh 的 check-error 会吞失败（裸 exit 继承上条 echo 的 0），
          # wsl 退出码不可信：Tee 落盘后扫描失败标记，防止 mesalib/installer
          # 等尾部阶段挂了还假绿（run 32654629928 的教训）。
          # 偶发失败重试一次：jom/nmake/mhmake 均增量，重试开销小。
          # 注意：字符串字面量一律纯 ASCII——无 BOM 临时 ps1 被 PS5.1 按
          # cp1252 解码，中文 UTF-8 尾字节 0x82/0x84/0x91-0x94 会被解成
          # 智能引号炸解析；中文只放注释（多字节序列结构上不含 0x0A/0x60
          # 等结构字节，注释必安全）
          $ok = $false
          foreach ($i in 1..2) {
            Write-Host "=== buildall attempt $i of 2 ==="
            wsl -d Ubuntu-22.04 bash -lc "cd '$ws/vcxsrv' && ./buildall.sh 1 5 R" | Tee-Object -FilePath "build-$i.log"
            $code = $LASTEXITCODE
            $hit = Select-String -Path "build-$i.log" -Pattern 'Error compiling','Error running command' -CaseSensitive -Quiet
            if ($code -eq 0 -and -not $hit) { $ok = $true; break }
            Write-Host "attempt $i failed (exit=$code, marker=$hit), retrying"
          }
          if (-not $ok) {
            Select-String -Path "build-2.log" -Pattern 'Error compiling','Error running command' -CaseSensitive
            throw "buildall failed after 2 attempts"
          }

      - name: 失败取证（openssl buildtest 失败输出被重定向进 .d）
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem vcxsrv\openssl\release64\test -Filter 'buildtest_c_types*' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.FullName)"; Get-Content $_.FullName -TotalCount 60 -ErrorAction SilentlyContinue }

      - name: 核验基线产物
        shell: powershell
        run: |
          $exe = "vcxsrv\xorg-server\obj64\servrelease\vcxsrv.exe"
          if (-not (Test-Path $exe)) { throw "vcxsrv.exe 未产出" }
          (Get-Item $exe).Length
          # installer 阶段（packageall.sh）失败无任何标记，只能靠产物核验兜底
          $inst = Get-ChildItem "vcxsrv\xorg-server\installer\vcxsrv-64.*.installer.exe" -ErrorAction SilentlyContinue
          if (-not $inst) { throw "installer exe missing" }
          $inst | ForEach-Object { "$($_.Name) $($_.Length)" }

      - uses: actions/upload-artifact@v4
        with:
          name: vcxsrv-baseline
          path: |
            vcxsrv/xorg-server/obj64/servrelease/vcxsrv.exe
            vcxsrv/xorg-server/installer/*.exe
          if-no-files-found: warn
